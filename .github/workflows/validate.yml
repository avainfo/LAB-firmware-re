name: Validate firmware submissions

on:
  push:
    paths:
      - 'labs/01-firmware-image-triage/submission.json'

permissions:
  contents: read

concurrency:
  group: firmware-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository != 'avainfo/LAB-firmware-re'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout fork
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate submission
        env:
          CRYPTO_KEY: AVAINFOLABREKEY
        run: python3 scripts/validate.py check --file labs/01-firmware-image-triage/submission.json
